<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#DB2777">
<title>BAMBAM BABY – Ponto</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Baloo+2:wght@700;800&display=swap');
:root{--rosa:#FF6B9D;--roxo:#C678DD;--azul:#61AFEF;--verde:#98C379;--amarelo:#E5C07B;--bg:#1a1a2e;--card:#16213e;--card2:#0f3460;--text:#f0f0f0;--sub:#a0aec0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}

#tela-senha{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#0f3460);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
.senha-box{background:#16213e;border:1.5px solid #ffffff15;border-radius:22px;padding:32px;width:100%;max-width:340px;text-align:center;}
.senha-box .logo-s{font-size:3rem;margin-bottom:12px;}
.senha-box h2{font-family:'Baloo 2',cursive;font-size:1.4rem;color:var(--rosa);margin-bottom:6px;}
.senha-box p{font-size:.85rem;color:var(--sub);margin-bottom:24px;}
.senha-box input{width:100%;padding:14px;border:1.5px solid #ffffff20;border-radius:12px;background:#0f3460;color:#f0f0f0;font-size:1.3rem;font-weight:700;text-align:center;letter-spacing:6px;margin-bottom:14px;}
.senha-box input:focus{outline:none;border-color:var(--rosa);}
.senha-box button{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--rosa),var(--roxo));color:#fff;font-size:1.1rem;font-weight:800;cursor:pointer;}
.erro{color:#ff4d6d;font-size:.85rem;margin-top:10px;display:none;font-weight:700;}

header{width:100%;background:linear-gradient(135deg,#C678DD,#FF6B9D);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
header h1{font-family:'Baloo 2',cursive;font-size:1.5rem;color:#fff;}
.badge{background:#fff3;border-radius:30px;padding:5px 16px;font-size:.85rem;font-weight:700;color:#fff;}

#offline-bar{display:none;background:#E5C07B;color:#1a1a2e;text-align:center;padding:10px;font-size:.85rem;font-weight:800;width:100%;}
#offline-bar.show{display:block;}

#app{width:95%;max-width:500px;margin:16px auto 80px;display:flex;flex-direction:column;gap:14px;}
.card{background:var(--card);border-radius:18px;padding:20px;border:1px solid #ffffff0f;}
#clock{text-align:center;font-size:2.5rem;font-weight:900;font-family:'Baloo 2',cursive;color:var(--azul);}
#date-str{text-align:center;font-size:.9rem;color:var(--sub);margin-top:4px;}

/* LEITOR QR sempre visível */
.card h2{font-family:'Baloo 2',cursive;font-size:1.1rem;color:var(--rosa);margin-bottom:12px;}
#reader{border-radius:12px;overflow:hidden;background:#000;min-height:240px;}

/* BOTÃO INICIAR sobre o leitor */
#iniciar-wrap{position:relative;}
#btn-iniciar{
  width:100%;padding:22px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--verde),#56d275);
  color:#fff;font-family:'Baloo 2',cursive;
  font-size:1.7rem;font-weight:900;cursor:pointer;
  box-shadow:0 6px 24px #98C37966;
  transition:.15s;
}
#btn-iniciar:active{transform:scale(.97);}
#btn-iniciar.oculto{display:none;}
#btn-iniciar.ativo{background:linear-gradient(135deg,#E5C07B,#C19A2E);color:#1a1a2e;}

#status-foto{text-align:center;font-size:.85rem;color:var(--sub);margin-top:6px;font-weight:700;min-height:20px;}

.excecao-wrap{display:flex;padding:0 4px;}
#btn-excecao{padding:10px 20px;border:none;border-radius:30px;background:#E5C07B33;border:1.5px solid #E5C07B88;color:#E5C07B;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:800;cursor:pointer;}
#btn-excecao.ativo{background:#ff4d6d33;border-color:#ff4d6d;color:#ff4d6d;}

#log-list{list-style:none;display:flex;flex-direction:column;gap:8px;max-height:160px;overflow-y:auto;}
#log-list li{background:var(--card2);border-radius:10px;padding:10px 14px;font-size:.9rem;display:flex;justify-content:space-between;align-items:center;}

#admin-btn{position:fixed;bottom:20px;right:20px;background:var(--card2);border:1.5px solid var(--roxo);border-radius:50px;padding:11px 20px;color:var(--roxo);font-weight:800;font-size:.85rem;cursor:pointer;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:#000c;z-index:200;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border:1.5px solid #ffffff15;border-radius:24px;padding:30px 24px;width:100%;max-width:400px;animation:popIn .2s ease;text-align:center;}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.func-inicial{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#C678DD,#FF6B9D);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#fff;}
.func-nome{font-size:1.5rem;font-weight:900;margin-bottom:4px;}
.func-id{font-size:.9rem;color:var(--sub);margin-bottom:20px;}
.status-box{border-radius:12px;padding:10px 16px;margin-bottom:16px;font-size:.9rem;font-weight:700;text-align:center;}
.status-bloq{background:#ff4d6d22;border:1.5px solid #ff4d6d;color:#ff4d6d;}
.status-exc{background:#E5C07B22;border:1.5px solid var(--amarelo);color:var(--amarelo);}
.escolha-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.btn-escolha{padding:22px 10px;border-radius:16px;border:2.5px solid transparent;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:900;cursor:pointer;text-align:center;line-height:1.4;}
.btn-escolha .ic{font-size:2.2rem;display:block;margin-bottom:6px;}
.btn-e{background:#98C37922;border-color:var(--verde);color:var(--verde);}
.btn-s{background:#FF6B9D22;border-color:var(--rosa);color:var(--rosa);}
.btn-bloq{opacity:.25;cursor:not-allowed!important;}
.confirma-box{border-radius:14px;padding:16px;margin-bottom:16px;font-size:1rem;font-weight:700;line-height:1.8;}
.c-entrada{background:#98C37922;border:2px solid var(--verde);color:var(--verde);}
.c-saida{background:#FF6B9D22;border:2px solid var(--rosa);color:var(--rosa);}
.btn-conf{display:block;width:100%;padding:18px;border:none;border-radius:14px;font-family:'Nunito',sans-serif;font-size:1.15rem;font-weight:900;cursor:pointer;margin-bottom:10px;}
.btn-verde{background:linear-gradient(90deg,#56d275,#98C379);color:#fff;}
.btn-rosa{background:linear-gradient(90deg,#FF6B9D,#C678DD);color:#fff;}
.btn-cancel{background:#ffffff0f;color:var(--sub);border:1.5px solid #ffffff20;font-size:1rem;}

#tela-conf{display:none;position:fixed;inset:0;z-index:500;align-items:center;justify-content:center;padding:20px;}
#tela-conf.show{display:flex;}
.conf-box{border-radius:28px;padding:44px 32px;width:100%;max-width:380px;text-align:center;}
.conf-box.entrada{background:linear-gradient(135deg,#1a3a2a,#0f3a1e);}
.conf-box.saida{background:linear-gradient(135deg,#3a1a2a,#3a0f1e);}
.conf-icon{font-size:5rem;margin-bottom:16px;}
.conf-tipo{font-size:1rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.7;margin-bottom:10px;}
.conf-nome{font-family:'Baloo 2',cursive;font-size:2.2rem;font-weight:900;color:#fff;margin-bottom:8px;}
.conf-hora{font-size:1.5rem;font-family:monospace;font-weight:700;margin-bottom:18px;opacity:.8;}
.conf-bar{height:6px;border-radius:10px;background:#ffffff33;}
.conf-fill{height:100%;border-radius:10px;animation:shrink 3s linear forwards;}
@keyframes shrink{from{width:100%}to{width:0%}}
.conf-box.entrada .conf-tipo,.conf-box.entrada .conf-hora{color:#98C379;}
.conf-box.entrada .conf-fill{background:#98C379;}
.conf-box.saida .conf-tipo,.conf-box.saida .conf-hora{color:#FF6B9D;}
.conf-box.saida .conf-fill{background:#FF6B9D;}
</style>
</head>
<body>

<div id="tela-senha">
  <div class="senha-box">
    <div class="logo-s">🍼</div>
    <h2>BAMBAM BABY</h2>
    <p>Digite a senha para autorizar</p>
    <input type="password" id="input-senha" placeholder="••••••" onkeydown="if(event.key==='Enter')verificarSenha()">
    <button onclick="verificarSenha()">🔓 Autorizar</button>
    <div class="erro" id="erro-senha">❌ Senha incorreta!</div>
  </div>
</div>

<div id="offline-bar">⚠️ SEM INTERNET — Registros salvos localmente</div>

<header>
  <h1>🍼 BAMBAM BABY</h1>
  <span class="badge" id="wifi-badge">Conectando…</span>
</header>

<div id="app">
  <div class="card">
    <div id="clock">--:--:--</div>
    <div id="date-str">carregando...</div>
  </div>

  <div class="card">
    <h2>🤳 Olhe para a câmera</h2>
    <!-- QR sempre rodando -->
    <div id="reader"></div>

    <!-- Botão INICIAR aparece sobre/abaixo do leitor -->
    <div style="margin-top:12px">
      <button id="btn-iniciar" onclick="iniciarRegistro()">
        📋 INICIAR REGISTRO
      </button>
      <div id="status-foto"></div>
      <img id="foto-preview-mini" style="display:none;width:80px;height:60px;object-fit:cover;border-radius:8px;margin-top:8px;border:2px solid var(--verde)">
    </div>
  </div>

  <div class="excecao-wrap">
    <button id="btn-excecao" onclick="toggleExcecao()">⚠️ Exceção</button>
  </div>

  <div class="card">
    <h2>📋 Registros de hoje</h2>
    <ul id="log-list"><li style="color:var(--sub);padding:8px">Nenhum registro ainda.</li></ul>
  </div>
</div>

<button id="admin-btn" onclick="location.href='admin.html'">⚙️ Admin</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div id="step1">
      <div class="func-inicial" id="av1"></div>
      <div class="func-nome" id="nm1">—</div>
      <div class="func-id" id="cg1">—</div>
      <div class="status-box" id="status-box" style="display:none"></div>
      <div class="escolha-grid">
        <button class="btn-escolha btn-e" id="btn-entrada" onclick="escolher('entrada')"><span class="ic">✅</span>ENTRADA</button>
        <button class="btn-escolha btn-s" id="btn-saida" onclick="escolher('saida')"><span class="ic">🚪</span>SAÍDA</button>
      </div>
      <button class="btn-conf btn-cancel" onclick="fecharModal()">Cancelar</button>
    </div>
    <div id="step2" style="display:none">
      <div class="func-inicial" id="av2"></div>
      <div class="func-nome" id="nm2">—</div>
      <div class="func-id" id="cg2">—</div>
      <div class="confirma-box" id="confirma-box"></div>
      <button class="btn-conf" id="btn-confirmar" onclick="confirmarPonto()">Confirmar</button>
      <button class="btn-conf btn-cancel" onclick="voltarStep1()">← Voltar</button>
    </div>
  </div>
</div>

<div id="tela-conf">
  <div class="conf-box" id="conf-box">
    <div class="conf-icon" id="conf-icon">✅</div>
    <div class="conf-tipo" id="conf-tipo">ENTRADA</div>
    <div class="conf-nome" id="conf-nome">—</div>
    <div class="conf-hora" id="conf-hora">--:--</div>
    <div class="conf-bar"><div class="conf-fill" id="conf-fill"></div></div>
  </div>
</div>

<canvas id="canvas-foto" style="display:none"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FC={apiKey:"AIzaSyDQ6EUH_HBLYd76HMCdlgupNcwzTHvgido",authDomain:"bambam-ponto.firebaseapp.com",databaseURL:"https://bambam-ponto-default-rtdb.firebaseio.com",projectId:"bambam-ponto",storageBucket:"bambam-ponto.firebasestorage.app",messagingSenderId:"30916647304",appId:"1:30916647304:web:70323b427dbdd0e51d423d"};
const app=initializeApp(FC);
const db=getDatabase(app);

const DIAS_KEY=['dom','seg','ter','qua','qui','sex','sab'];
const dh=()=>new Date().toISOString().split('T')[0];
const toMin=(h)=>{const[hh,mm]=h.split(':').map(Number);return hh*60+mm;};
const doisNomes=(n)=>{const p=n.trim().split(' ').filter(x=>x.length>2);return p.slice(0,2).join(' ')||n.split(' ')[0];};
const iniciais=(n)=>{const p=n.trim().split(' ');return(p[0][0]+(p[1]?.[0]||'')).toUpperCase();};

let funcionarios={},logHoje=[],funcSel=null,tipoEsc=null;
let bloqueadoPorFunc={};
let modoExcecao=false;
let qrScanner=null;
let ultimoFrame=null;
let videoRef=null;
let aguardandoQR=false; // true após INICIAR, esperando leitura do QR

// ── AUTORIZAÇÃO ──
async function checarAutorizacao(){
  const snap=await get(ref(db,'config/senha_index'));
  const sa=snap.val()||'102030';
  if(localStorage.getItem('bambam_senha_index')===sa){
    document.getElementById('tela-senha').style.display='none';
    iniciarApp();
  }
}
window.verificarSenha=async function(){
  const dig=document.getElementById('input-senha').value.trim();
  const snap=await get(ref(db,'config/senha_index'));
  const cor=snap.val()||'102030';
  if(dig===cor){
    localStorage.setItem('bambam_senha_index',cor);
    document.getElementById('tela-senha').style.display='none';
    iniciarApp();
  } else {
    document.getElementById('erro-senha').style.display='block';
    document.getElementById('input-senha').value='';
    setTimeout(()=>{document.getElementById('erro-senha').style.display='none';},3000);
  }
};

window.toggleExcecao=function(){
  modoExcecao=!modoExcecao;
  const btn=document.getElementById('btn-excecao');
  btn.classList.toggle('ativo',modoExcecao);
  btn.textContent=modoExcecao?'⚠️ EXC ATIVA':'⚠️ Exceção';
  mostrarToast(modoExcecao?'⚠️ Exceção ativada!':'✅ Desativada.',modoExcecao?'#E5C07B':'#98C379');
};

function iniciarApp(){
  function tick(){
    const n=new Date();
    document.getElementById('clock').textContent=n.toLocaleTimeString('pt-BR');
    document.getElementById('date-str').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  }
  tick(); setInterval(tick,1000);
  document.getElementById('wifi-badge').textContent='✅ Online';
  onValue(ref(db,'funcionarios'),snap=>{
    funcionarios={};
    const d=snap.val();
    if(d) Object.values(d).forEach(f=>{if(!f.desligamento||f.desligamento>=dh()) funcionarios[f.id]=f;});
  });
  onValue(ref(db,'registros/'+dh()),snap=>{
    logHoje=[];
    const d=snap.val();
    if(d) logHoje=Object.values(d);
    renderLog();
  });
  monitorarConexao();
  sincronizarPendentes();
  limparFotosAntigas();
  iniciarScanner();
}

function renderLog(){
  const list=document.getElementById('log-list');
  if(!logHoje.length){list.innerHTML='<li style="color:var(--sub);padding:8px">Nenhum registro ainda.</li>';return;}
  list.innerHTML=[...logHoje].reverse().slice(0,15).map(r=>`
    <li>
      <span style="font-weight:700">${doisNomes(r.nome)}</span>
      <span style="color:var(--sub)">${r.tipo==='entrada'?'🟢':'🔴'} ${r.hora}</span>
    </li>`).join('');
}

// ── SCANNER QR — inicia com câmera frontal e fica rodando sempre ──
function iniciarScanner(){
  qrScanner=new Html5Qrcode("reader");
  qrScanner.start(
    {facingMode:"user"},
    {fps:10,qrbox:{width:220,height:220}},
    txt=>{
      // Só processa QR se INICIAR foi pressionado
      if(!aguardandoQR) return;
      aguardandoQR=false;
      // Reseta botão
      const btn=document.getElementById('btn-iniciar');
      btn.textContent='📋 INICIAR REGISTRO';
      btn.style.background='linear-gradient(135deg,var(--verde),#56d275)';
      btn.disabled=false;
      document.getElementById('status-foto').textContent='';
      abrirModal(txt);
    },
    ()=>{}
  ).then(()=>{
    // Guarda referência ao video quando câmera iniciar
    const buscar=setInterval(()=>{
      const v=document.querySelector('#reader video')||document.querySelector('video');
      if(v&&v.videoWidth>0){
        clearInterval(buscar);
        videoRef=v;
      }
    },500);
  }).catch(()=>{
    document.getElementById('reader').innerHTML='<p style="color:var(--sub);padding:20px;text-align:center">📵 Câmera não disponível.</p>';
  });
}

// ── BOTÃO INICIAR — captura foto e aguarda QR ──
window.iniciarRegistro=function(){
  if(aguardandoQR){
    // Cancela se pressionar de novo
    aguardandoQR=false;
    ultimoFrame=null;
    const btn=document.getElementById('btn-iniciar');
    btn.textContent='📋 INICIAR REGISTRO';
    btn.style.background='linear-gradient(135deg,var(--verde),#56d275)';
    document.getElementById('status-foto').textContent='';
    return;
  }

  // Captura frame do vídeo QR neste momento
  ultimoFrame=null;
  const statusEl=document.getElementById('status-foto');

  try{
    const v=videoRef||document.querySelector('#reader video')||document.querySelector('video');
    if(v&&v.videoWidth>0){
      const c=document.getElementById('canvas-foto');
      const ratio=Math.min(240/v.videoWidth,180/v.videoHeight);
      c.width=Math.round(v.videoWidth*ratio);
      c.height=Math.round(v.videoHeight*ratio);
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      const foto=c.toDataURL('image/jpeg',0.4);
      if(foto&&foto.length>3000){
        ultimoFrame=foto;
        statusEl.textContent='📸 Foto capturada ('+Math.round(foto.length/1024)+'KB) — leia o crachá!';
        statusEl.style.color='var(--verde)';
        // Mostra miniatura
        const mini=document.getElementById('foto-preview-mini');
        mini.src=foto; mini.style.display='block';
      } else {
        statusEl.textContent='⚠️ Frame vazio ('+foto.length+' bytes) — video: '+v.videoWidth+'x'+v.videoHeight;
        statusEl.style.color='#ff4d6d';
        document.getElementById('foto-preview-mini').style.display='none';
      }
    } else {
      const v2=videoRef||document.querySelector('#reader video')||document.querySelector('video');
      statusEl.textContent=v2?'⚠️ Video sem dimensões: '+v2.videoWidth+'x'+v2.videoHeight:'❌ Video não encontrado';
      statusEl.style.color='#ff4d6d';
      document.getElementById('foto-preview-mini').style.display='none';
    }
  }catch(e){
    statusEl.textContent='❌ Erro: '+e.message;
    statusEl.style.color='#ff4d6d';
  }

  // Ativa modo aguardando QR
  aguardandoQR=true;
  const btn=document.getElementById('btn-iniciar');
  btn.textContent='🪪 Leia o crachá agora… (toque para cancelar)';
  btn.style.background='linear-gradient(135deg,#E5C07B,#C19A2E)';
};

// ── JORNADA ──
function getJornada(f){
  const dk=DIAS_KEY[new Date().getDay()];
  if(!f.jornada||!f.jornada[dk]||!f.jornada[dk].length) return null;
  return f.jornada[dk];
}
async function buscarRegsHoje(empId){
  const snap=await get(ref(db,'registros/'+dh()));
  const v=snap.val();
  if(!v) return [];
  return Object.values(v).filter(r=>r.empId===empId).sort((a,b)=>a.hora.localeCompare(b.hora));
}

// ── MODAL ──
window.abrirModal=async function(empId){
  const f=funcionarios[empId];
  if(!f){mostrarToast('❌ Crachá não reconhecido.','#ff4d6d');aguardandoQR=false;return;}
  const regs=await buscarRegsHoje(f.id);
  funcSel=f; tipoEsc=null;

  document.getElementById('av1').textContent=iniciais(f.nome);
  document.getElementById('nm1').textContent=doisNomes(f.nome);
  document.getElementById('cg1').textContent='🪪 '+f.id;
  document.getElementById('step1').style.display='block';
  document.getElementById('step2').style.display='none';
  document.getElementById('modal').classList.add('open');

  const btnE=document.getElementById('btn-entrada');
  const btnS=document.getElementById('btn-saida');
  const statusBox=document.getElementById('status-box');
  btnE.classList.remove('btn-bloq'); btnE.onclick=()=>escolher('entrada');
  btnS.classList.remove('btn-bloq'); btnS.onclick=()=>escolher('saida');
  statusBox.style.display='none';

  const ultimo=regs[regs.length-1];
  const jornada=getJornada(f);
  const agoraMin=new Date().getHours()*60+new Date().getMinutes();

  if(!ultimo){
    btnS.classList.add('btn-bloq');
    btnS.onclick=()=>mostrarToast('⚠️ Primeiro registro deve ser ENTRADA!','#E5C07B');
    return;
  }
  if(ultimo.tipo==='entrada'){
    btnE.classList.add('btn-bloq');
    btnE.onclick=()=>mostrarToast('⚠️ Registre a SAÍDA!','#E5C07B');
    if(jornada&&!modoExcecao){
      const saidasN=regs.filter(r=>r.tipo==='saida'&&!r.excecao);
      const pi=Math.min(saidasN.length,jornada.length-1);
      const lib=toMin(jornada[pi].saida)-2;
      if(agoraMin<lib){
        const falta=lib-agoraMin;
        statusBox.className='status-box status-bloq';
        statusBox.innerHTML=`⏱️ Saída às ${jornada[pi].saida} — faltam ${Math.floor(falta/60)>0?Math.floor(falta/60)+'h ':''} ${falta%60}min`;
        statusBox.style.display='block';
        btnS.classList.add('btn-bloq');
        btnS.onclick=()=>mostrarToast('⏱️ Use Exceção para saída antecipada.','#E5C07B');
      }
    }
    return;
  }
  if(ultimo.tipo==='saida'){
    btnS.classList.add('btn-bloq');
    btnS.onclick=()=>mostrarToast('⚠️ Registre a ENTRADA!','#E5C07B');
  }
  if(modoExcecao){
    statusBox.className='status-box status-exc';
    statusBox.innerHTML='⚠️ MODO EXCEÇÃO ATIVO';
    statusBox.style.display='block';
    btnE.classList.remove('btn-bloq'); btnE.onclick=()=>escolher('entrada');
    btnS.classList.remove('btn-bloq'); btnS.onclick=()=>escolher('saida');
  }
};

window.escolher=function(tipo){
  tipoEsc=tipo;
  const f=funcSel, hora=new Date().toLocaleTimeString('pt-BR');
  document.getElementById('av2').textContent=iniciais(f.nome);
  document.getElementById('nm2').textContent=doisNomes(f.nome);
  document.getElementById('cg2').textContent='🪪 '+f.id;
  const box=document.getElementById('confirma-box'), btn=document.getElementById('btn-confirmar');
  if(tipo==='entrada'){
    box.className='confirma-box c-entrada';
    box.innerHTML=`✅ ENTRADA${modoExcecao?' ⚠️':''}<br><strong style="font-size:1.3rem">às ${hora}</strong>`;
    btn.className='btn-conf btn-verde'; btn.textContent='✅ Confirmar ENTRADA';
  } else {
    box.className='confirma-box c-saida';
    box.innerHTML=`🚪 SAÍDA${modoExcecao?' ⚠️':''}<br><strong style="font-size:1.3rem">às ${hora}</strong>`;
    btn.className='btn-conf btn-rosa'; btn.textContent='🚪 Confirmar SAÍDA';
  }
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
};

window.voltarStep1=function(){
  tipoEsc=null;
  document.getElementById('step1').style.display='block';
  document.getElementById('step2').style.display='none';
};

window.fecharModal=function(){
  document.getElementById('modal').classList.remove('open');
  funcSel=null; tipoEsc=null;
  ultimoFrame=null;
  document.getElementById('status-foto').textContent='';
  document.getElementById('foto-preview-mini').style.display='none';
  document.getElementById('btn-iniciar').textContent='📋 INICIAR REGISTRO';
  document.getElementById('btn-iniciar').style.background='linear-gradient(135deg,var(--verde),#56d275)';
};
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)fecharModal();});

window.confirmarPonto=async function(){
  if(!funcSel||!tipoEsc) return;
  const f=funcSel, agora=new Date();
  document.getElementById('btn-confirmar').disabled=true;

  const reg={empId:f.id,nome:f.nome,cargo:f.cargo||'Colaborador',tipo:tipoEsc,
    data:dh(),hora:agora.toLocaleTimeString('pt-BR'),
    timestamp:agora.toISOString(),excecao:modoExcecao};

  if(navigator.onLine){
    try{ await push(ref(db,'registros/'+dh()),reg); }
    catch(e){ salvarOffline(reg); }
  } else { salvarOffline(reg); }

  if(navigator.vibrate) navigator.vibrate([80,40,80]);
  bloqueadoPorFunc[f.id]=Date.now()+(5*60*1000);

  // Salva foto capturada no INICIAR
  if(ultimoFrame){
    const chave=f.id+'_'+Date.now();
    set(ref(db,'fotos_auditoria/'+dh()+'/'+chave),{
      empId:f.id, nome:f.nome, tipo:tipoEsc,
      foto:ultimoFrame,
      hora:agora.toLocaleTimeString('pt-BR'),
      timestamp:agora.toISOString()
    }).catch(()=>{});
    ultimoFrame=null;
  }

  if(modoExcecao){
    modoExcecao=false;
    document.getElementById('btn-excecao').classList.remove('ativo');
    document.getElementById('btn-excecao').textContent='⚠️ Exceção';
  }

  const nome=doisNomes(f.nome), tipo=tipoEsc, hora=agora.toLocaleTimeString('pt-BR');
  document.getElementById('modal').classList.remove('open');
  document.getElementById('status-foto').textContent='';
  document.getElementById('foto-preview-mini').style.display='none';
  document.getElementById('btn-iniciar').textContent='📋 INICIAR REGISTRO';
  document.getElementById('btn-iniciar').style.background='linear-gradient(135deg,var(--verde),#56d275)';
  funcSel=null; tipoEsc=null;

  mostrarConfirmacao(nome,tipo,hora);
  document.getElementById('btn-confirmar').disabled=false;
};

function mostrarConfirmacao(nome,tipo,hora){
  document.getElementById('conf-box').className='conf-box '+tipo;
  document.getElementById('conf-icon').textContent=tipo==='entrada'?'✅':'👋';
  document.getElementById('conf-tipo').textContent=tipo==='entrada'?'ENTRADA REGISTRADA':'SAÍDA REGISTRADA';
  document.getElementById('conf-nome').textContent=nome;
  document.getElementById('conf-hora').textContent=hora;
  const fill=document.getElementById('conf-fill');
  fill.style.animation='none'; fill.offsetHeight; fill.style.animation='shrink 3s linear forwards';
  const tela=document.getElementById('tela-conf');
  tela.classList.add('show');
  setTimeout(()=>tela.classList.remove('show'),3000);
}

// ── OFFLINE ──
const OK='bambam_offline_regs';
function salvarOffline(reg){const p=getPend();p.push({...reg,_id:Date.now()});localStorage.setItem(OK,JSON.stringify(p));mostrarToast('📴 Salvo localmente!','#E5C07B');}
function getPend(){try{return JSON.parse(localStorage.getItem(OK)||'[]');}catch{return[];}}
async function sincronizarPendentes(){
  if(!navigator.onLine) return;
  const p=getPend(); if(!p.length) return;
  let ok=0; const falhos=[];
  for(const r of p){try{const{_id,...reg}=r;await push(ref(db,'registros/'+reg.data),reg);ok++;}catch(e){falhos.push(r);}}
  localStorage.setItem(OK,JSON.stringify(falhos));
  if(ok) mostrarToast(`✅ ${ok} sincronizado(s)!`,'#98C379');
}
function monitorarConexao(){
  const bar=document.getElementById('offline-bar');
  window.addEventListener('online',()=>{bar.classList.remove('show');sincronizarPendentes();});
  window.addEventListener('offline',()=>bar.classList.add('show'));
  if(!navigator.onLine) bar.classList.add('show');
  setInterval(()=>{if(navigator.onLine)sincronizarPendentes();},30000);
}
async function limparFotosAntigas(){
  try{
    const snap=await get(ref(db,'fotos_auditoria'));
    if(!snap.exists()) return;
    const lim=new Date(); lim.setMonth(lim.getMonth()-3);
    const limStr=lim.toISOString().split('T')[0];
    const proms=[];
    snap.forEach(d=>{if(d.key<limStr) proms.push(remove(ref(db,'fotos_auditoria/'+d.key)));});
    if(proms.length) await Promise.all(proms);
  }catch(e){}
}
function mostrarToast(msg,cor){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';Object.assign(t.style,{position:'fixed',bottom:'80px',left:'50%',transform:'translateX(-50%) translateY(80px)',color:'#fff',padding:'13px 26px',borderRadius:'30px',fontFamily:'Nunito,sans-serif',fontWeight:'800',fontSize:'.95rem',boxShadow:'0 8px 24px #0006',transition:'transform .3s',zIndex:'999',whiteSpace:'nowrap',maxWidth:'90vw',textAlign:'center'});document.body.appendChild(t);}
  t.textContent=msg; t.style.background=cor||'#1F2937';
  setTimeout(()=>{t.style.transform='translateX(-50%) translateY(0)';},10);
  setTimeout(()=>{t.style.transform='translateX(-50%) translateY(80px)';},4000);
}

checarAutorizacao();
</script>
